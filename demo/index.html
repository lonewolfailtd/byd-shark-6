<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lonewolf Shark demo</title>
<style>
:root{--accent:#19E3FF;--dim:#0B5F78;--glow:rgba(25,227,255,.35);--bad:#FF5252;--warm:#FF7043;--cool:#42A5F5;--text:#F2F5F9;--muted:#A9BCD6;--line:#223047;--glass:linear-gradient(rgba(18,32,56,.85),rgba(6,11,22,.92))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);overflow:hidden;user-select:none}
#fit{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:#0B1220;overflow:hidden}
#top{height:40px;background:#070B14;display:flex;align-items:center;padding:0 18px;gap:18px;font-size:15px}
#top b{letter-spacing:3px;font-size:16px}#top b i{font-style:normal;color:var(--accent)}
#top .sp{flex:1}#top .demo{color:var(--bad);font-size:13px}#top .ok{color:var(--accent);font-size:13px}
#page{position:absolute;top:40px;bottom:66px;left:0;right:0;background-size:cover;background-position:center}
#page:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,var(--w1)),rgba(0,0,0,var(--w2)),rgba(0,0,0,var(--w3)))}
#in{position:absolute;inset:0;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#in::-webkit-scrollbar{width:0}
#tabs{position:absolute;bottom:0;left:0;right:0;height:66px;background:#070B14;display:flex}
#tabs button{flex:1;background:none;border:0;color:var(--text);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#tabs button:before{content:"";height:3px;width:50%;background:transparent;margin-bottom:5px}
#tabs button.on{color:var(--accent);font-weight:700;text-shadow:0 0 12px var(--glow)}#tabs button.on svg{filter:drop-shadow(0 0 6px var(--accent))}#tabs{border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}#tabs button.on:before{background:var(--accent)}
#tabs svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.f1{flex:1}.f2{flex:2}.c{align-items:center}
.g,.p{box-shadow:0 0 18px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.g{background:var(--glass);border:1.2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:center}
.p{background:var(--glass);border:1.2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:18px;padding:16px}
.h{color:var(--accent);font-size:12px;letter-spacing:1.8px;font-weight:700;text-shadow:0 0 10px var(--glow);text-transform:uppercase}
.n{font-size:32px;font-weight:700;line-height:1.15;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.25)}.s{color:var(--muted);font-size:12px}
.bar i{box-shadow:0 0 10px currentColor}.bar{height:9px;border-radius:4px;background:var(--line);margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.t{min-height:52px;border-radius:14px;background:linear-gradient(rgba(26,42,71,.92),rgba(12,20,36,.92));border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--text);font-size:17px;font-weight:600;cursor:pointer;padding:0 14px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t small{font-size:12px;font-weight:400;color:var(--muted)}
.t.on{background:linear-gradient(color-mix(in srgb,var(--accent) 85%,#000),var(--dim));border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 0 18px -2px var(--glow)}.t.on small{color:rgba(255,255,255,.8)}.t:active{filter:brightness(1.4)}
.seat{width:84px}.seat.heat.on{background:rgba(255,112,67,.28);border-color:var(--warm)}.seat.vent.on{background:rgba(66,165,245,.28);border-color:var(--cool)}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.heat .pips i.a{background:var(--warm)}.vent .pips i.a{background:var(--cool)}
.gauge{width:150px;text-align:center;color:var(--muted);font-size:13px}.gauge svg{width:150px;height:150px;display:block;filter:drop-shadow(0 0 8px var(--glow))}.gauge{color:var(--text);text-transform:uppercase;letter-spacing:1px;font-weight:600;font-size:12px}
.dial{width:300px;text-align:center}.dial .lab{color:var(--accent);letter-spacing:2px;font-size:14px}.dial .face{width:300px;height:300px;border-radius:50%;background:radial-gradient(rgba(10,20,40,.8),rgba(0,0,0,.95));border:3px solid var(--accent);box-shadow:0 0 30px -4px var(--glow),inset 0 0 40px rgba(0,0,0,.8);position:relative;overflow:hidden;cursor:grab}
.dial img{position:absolute;left:50%;bottom:112px;transform-origin:50% 100%}.dial .lvl{position:absolute;left:8%;right:8%;top:186px;height:3px;background:var(--accent);transform-origin:50% 50%}
.dial .deg{position:absolute;bottom:34px;left:0;right:0;font-size:40px;font-weight:700;color:var(--accent)}
.stat{display:flex;padding:4px 0;font-size:15px}.stat span{color:var(--muted);width:220px}
input[type=text]{width:100%;background:#0B1220;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:16px;padding:12px;font-family:inherit;margin-top:6px}
.cam{background:#000 center/cover;border-radius:12px;position:relative;overflow:hidden}.cam span{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:13px}
.cam em{position:absolute;left:10px;bottom:8px;font:600 14px Consolas,monospace;background:rgba(0,0,0,.5);padding:2px 8px;font-style:normal}
.clip{display:flex;align-items:center;padding:10px 12px;border-radius:10px;background:#1B2638;border:1px solid var(--line);cursor:pointer;margin-bottom:6px}.clip.on{background:var(--dim);border-color:var(--accent)}
#pet{position:absolute;inset:40px 0 66px 0;background:#05080F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.note{position:absolute;right:14px;top:50px;background:#FFD54F;color:#111;padding:6px 12px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.note.show{opacity:1}

#intro{position:absolute;inset:0;background:#000;z-index:9;overflow:hidden;cursor:pointer;transition:opacity .45s}
#intro.out{opacity:0;pointer-events:none}
#intro .ph{position:absolute;inset:0;background:center/cover;opacity:0;animation:iph .9s linear forwards,izoom 2.6s cubic-bezier(.2,.7,.2,1) forwards}
#intro .sh{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent,rgba(0,0,0,.8))}
#intro .tx{position:absolute;left:64px;bottom:72px}
#intro .w,#intro .k{display:inline-block;font-size:56px;font-weight:700;letter-spacing:8px;opacity:0;transform:translateY(24px);animation:iup .5s cubic-bezier(.2,.7,.2,1) forwards}
#intro .w{color:#fff;animation-delay:.35s}#intro .k{color:var(--accent);margin-left:18px;animation-delay:.6s}
#intro .ln{height:3px;width:0;margin-top:6px;background:linear-gradient(90deg,var(--accent),transparent);animation:iln .6s cubic-bezier(.2,.7,.2,1) .9s forwards;box-shadow:0 0 12px var(--glow)}
#intro .tg{color:var(--muted);font-size:14px;letter-spacing:4px;margin-top:12px;opacity:0;animation:ifd .4s 1.15s forwards}
@keyframes iph{to{opacity:.75}}@keyframes izoom{from{transform:scale(1.12)}to{transform:scale(1)}}@keyframes iup{to{opacity:1;transform:none}}@keyframes iln{to{width:520px}}@keyframes ifd{to{opacity:1}}
</style>
</head>
<body>
<div id="fit">
  <div id="intro"><div class="ph" id="iph"></div><div class="sh"></div><div class="tx"><span class="w">LONEWOLF</span><span class="k">SHARK</span><div class="ln"></div><div class="tg">BUILT FOR THE BYD SHARK 6</div></div></div>
  <div id="top"><b>LONEWOLF<i>SHARK</i></b><span class="sp"></span><span class="demo" id="rec"></span><span class="ok">demo data</span><span id="out"></span><span id="clock"></span></div>
  <div id="page"><div id="in"></div></div>
  <div class="note" id="note"></div>
  <div id="tabs"></div>
</div>
<script>
const S={tab:'Home',colour:'white',theme:'CYAN',soc:82,fuel:64,odo:18432,speed:0,rpm:0,gear:1,outside:17,v12:13.1,coolant:74,
 pt:21,dt:21,fan:2,on:true,ac:true,sync:false,recirc:false,auto:false,demist:false,rearHeat:false,
 ph:0,pv:0,dh:1,dv:0,mode:3,power:0,terrain:'Normal',pitch:-1.1,roll:0.9,pp:0,pr:0,sens:'Normal',
 tow:false,trailer:0,ext:0,cal:0,add:0,basis:8.5,left:null,petT:21,petMsg:'Back soon',petPh:'',pet:false,
 rec:false,sentry:false,cam:'Front',quad:true,flat:true,browse:false,clip:0,cap:8,stamp:true,autoRec:false,autoSentry:false,drive:false,bearing:40,
 night:false,floating:true,towMore:false,v2l:5,large:false,plain:false,share:false,apps:['Rage mode','','','','',''],filter:'All'};
const THEMES={CYAN:['#19E3FF','#0B5F78','Electric'],GREEN:['#2BFF9A','#14704A','Green'],RED:['#FF2D3F','#7A1420','Red'],BLUE:['#2FA8FF','#15507A','Blue'],AMBER:['#FFB020','#7A5410','Amber'],ICE:['#E8EEF6','#4A5A70','White']};
const COLOURS=[['white','White'],['grey','Grey'],['black','Black'],['blue','Blue'],['orange','Orange']];
const MODES={1:'Eco',2:'Sport',3:'Normal'};
const TABS=['Home','Climate','Drive','Gauges','Energy','Towing','Cameras','Trips','Settings'];
const MEM=[['lane','Lane departure','Warning and steering nudge when you drift',1],['dms','Driver monitoring','The camera that watches the driver',1],['fatigue','Fatigue alert','Tired driver reminder',1],['highBeam','Auto high beam','Dips the lights for oncoming traffic',1],['speedLimit','Speed limit warning','The chime when you pass the limit',1],['signs','Traffic sign alerts','Sign recognition on the cluster',1],['clusterMap','Map on the driver display','Full screen navigation in front of you',2],['collision','Collision warning timing','How early the warning sounds, not the braking',2]];
const ICON={Home:'<path d="M3 11l9-7.5 9 7.5M5.5 9.5V20h13V9.5M10 20v-6h4v6"/>',Climate:'<circle cx="12" cy="12" r="2"/><path d="M12 10c-3-2-3-6 0-7.5 2 2 2 5 0 7.5zM14 12c2-3 6-3 7.5 0-2 2-5 2-7.5 0zM12 14c3 2 3 6 0 7.5-2-2-2-5 0-7.5zM10 12c-2 3-6 3-7.5 0 2-2 5-2 7.5 0z"/>',Drive:'<path d="M2 20L9 7l4 7 3-4 6 10z"/>',Gauges:'<path d="M4.2 17.5a9 9 0 1115.6 0M12 13l4.5-4.5"/><circle cx="12" cy="13" r="1.2"/>',Energy:'<rect x="4" y="3.5" width="10" height="17" rx="1.5"/><path d="M4 10h10M14 8h4l1.5 2v7M2.5 20.500h13"/><circle cx="19.500" cy="18.200" r="1.2"/>',Towing:'<path d="M2 16v-5h3l2-3.500h5V11h5v5M17 14.500h4"/><circle cx="6" cy="16.500" r="2"/><circle cx="14" cy="16.500" r="2"/>',Cameras:'<rect x="2.500" y="7" width="13" height="10.500" rx="2"/><path d="M15.500 10.500l6-3V17l-6-3"/>',Trips:'<circle cx="6" cy="18" r="2.200"/><circle cx="18" cy="6" r="2.200"/><path d="M8 17c8 0-2-9 7.800-10.400"/>',Pet:'<ellipse cx="12" cy="16.200" rx="4.500" ry="3.700" fill="currentColor"/><circle cx="5.500" cy="10.500" r="1.900" fill="currentColor"/><circle cx="9.500" cy="6.500" r="1.900" fill="currentColor"/><circle cx="14.500" cy="6.500" r="1.900" fill="currentColor"/><circle cx="18.500" cy="10.500" r="1.900" fill="currentColor"/>',Memory:'<rect x="4" y="3.500" width="16" height="17" rx="2"/><rect x="8" y="3.500" width="8" height="5.500" rx="1"/><rect x="7.500" y="13" width="9" height="7.500" rx="1"/>',Settings:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.500"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100" stroke-width="2.600"/>'};
const BG={Home:['bg_home',1,.3,0,.35],Climate:['bg_climate',0,.4,.05,.45],Drive:['bg_offroad',1,.25,0,.3,'center 55%'],Gauges:['bg_gauges',1,.25,0,.3],Energy:['bg_fuel',1,.35,.03,.4],Towing:['bg_towing',1,.25,0,.15,'center 45%'],Cameras:['bg_cameras',0,.75,.2,.8],Trips:['bg_cameras',0,.7,.18,.75],Settings:['bg_climate',0,.7,.18,.75]};
const $=s=>document.querySelector(s);
const total=()=>60+S.ext, left=()=>S.ext&&S.left!=null?S.left:Math.min(60,S.fuel/100*60*(1+S.cal/100));
const evR=()=>Math.round(S.soc*1.0), fuR=()=>Math.round(left()/S.basis*100);
const T=(label,act,on,w,sub,h)=>`<button class="t ${on?'on':''}" data-a="${act}" style="${w?`width:${w}px;`:'flex:1;'}${h?`min-height:${Math.max(h,48)}px`:''}">${label}${sub?`<small>${sub}</small>`:''}</button>`;
const bar=(f,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(1,f))*100}%;background:${c}"></i></div>`;
const tc=t=>t<=19?'var(--cool)':t>=25?'var(--warm)':'var(--text)';
function gauge(label,val,f,col,unit,scale){const raw=f;f=Math.max(0,Math.min(1,f||0));const r=63,c=2*Math.PI*r,a=c*.75;let ticks='';if(scale)scale.forEach((t,i)=>{const ang=(135+270*i/(scale.length-1))*Math.PI/180;ticks+=`<text x="${75+42*Math.cos(ang)}" y="${75+42*Math.sin(ang)+3}" text-anchor="middle" fill="#C9D6E8" font-size="9">${t}</text>`});if(raw!=null){const ang=(135+270*f)*Math.PI/180;ticks+=`<circle cx="${75+r*Math.cos(ang)}" cy="${75+r*Math.sin(ang)}" r="8" fill="rgba(255,255,255,.35)"/><circle cx="${75+r*Math.cos(ang)}" cy="${75+r*Math.sin(ang)}" r="4.5" fill="#fff"/>`}for(let i=0;i<=18;i++)ticks+=`<line x1="75" y1="20" x2="75" y2="${i%3?25:30}" stroke="#4A5C7A" stroke-width="${i%3?1:2}" transform="rotate(${-135+i*15} 75 75)"/>`;
 return `<div class="gauge"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="rgba(8,13,24,.7)"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="#223047" stroke-width="12" stroke-linecap="round" stroke-dasharray="${a} ${c}" transform="rotate(135 75 75)"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${a*f} ${c}" transform="rotate(135 75 75)"/>${ticks}<text x="75" y="80" text-anchor="middle" fill="#F2F5F9" font-size="30" font-weight="700">${val}</text><text x="75" y="100" text-anchor="middle" fill="#8FA3BF" font-size="12">${unit||''}</text></svg>${label}</div>`}
const seat=(k,label,cls)=>`<button class="t seat ${cls} ${S[k]?'on':''}" data-a="seat:${k}"><small>Seat</small>${label}<span class="pips"><i class="${S[k]>0?'a':''}"></i><i class="${S[k]>1?'a':''}"></i></span></button>`;
const tempBox=(k,label)=>`<div class="g" style="width:200px;padding:6px;flex-direction:row;align-items:center;gap:4px">${T('−','dec:'+k,0,52,0,56)}<div class="f1" style="text-align:center"><div class="s">${label}</div><div style="font-size:30px;font-weight:700;color:${tc(S[k])}">${S[k]}°</div></div>${T('+','inc:'+k,0,52,0,56)}</div>`;
const dial=(k,label,img)=>{const v=S[k],w=Math.abs(v)>=25;return `<div class="dial"><div class="lab" style="${w?'color:var(--bad)':''}">${label.toUpperCase()}</div><div class="face" data-drag="${k}"><img src="art/${img}_${S.colour}.webp" style="width:${k=='pitch'?230:150}px;margin-left:${k=='pitch'?-115:-75}px;transform:rotate(${k=='pitch'?-v:v}deg)" draggable="false"><div class="lvl" style="transform:rotate(${k=='pitch'?-v:v}deg);${w?'background:var(--bad)':''}"></div><div class="deg" style="${w?'color:var(--bad)':''}">${v.toFixed(1)}°</div></div></div>`};
const CLIPS=[];{const cams=['Front','Rear','Driver side','Passenger side'];for(let i=0;i<14;i++){const d=new Date(Date.now()-i*1000*180*1.3-600000);CLIPS.push({cam:cams[i%4],t:d,mb:120+((i*37)%90),p:i==3||i==8})}}
const fmtT=d=>d.toLocaleString('en-NZ',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const CAMIMG={Front:'bg_cameras',Rear:'bg_gauges_'+'C','Driver side':'bg_offroad_C','Passenger side':'bg_climate',Cabin:'bg_pet_C'};
const camUrl=c=>'art/'+CAMIMG[c].replace('C',S.colour)+'.webp';
const P={
Home:()=>`<div class="row f1"><div class="col" style="width:270px"><div class="row f1"><div class="g f1"><div class="h">Battery</div><div class="n">${Math.round(S.soc)}%</div>${bar(S.soc/100,'var(--accent)')}<div class="s">${evR()} km on battery</div></div><div class="g f1"><div class="h">Fuel</div><div class="n">${Math.round(left()/total()*100)}%</div>${bar(left()/total(),'var(--warm)')}<div class="s">${fuR()} km of fuel</div></div></div><div class="g f1"><div class="h">Total range</div><div class="n" style="font-size:38px">${evR()+fuR()} km</div>${bar((evR()+fuR())/900,'var(--cool)')}<div class="s">Odometer ${Math.round(S.odo).toLocaleString()} km</div></div></div><div class="f1"></div>
<div class="col" style="width:300px"><div class="row" style="flex:1.2"><div class="g f1"><div class="h">Outside</div><div class="n">${S.outside}°</div></div><div class="g f1"><div class="h">Engine</div><div class="n" style="font-size:26px">${S.rpm?S.rpm:'Off'}</div><div class="s">${S.rpm?'rpm':'running on battery'}</div></div><div class="g f1 c"><svg viewBox="0 0 64 64" width="64"><circle cx="32" cy="32" r="29" fill="none" stroke="#3A4B66" stroke-width="3"/><g transform="rotate(${-S.bearing} 32 32)"><path d="M32 10l-5 22h10z" fill="var(--accent)"/><path d="M32 54l-5-22h10z" fill="#3A4B66"/></g></svg><div class="s">${['N','NE','E','SE','S','SW','W','NW'][Math.round(S.bearing/45)%8]} ${Math.round(S.bearing)}°</div></div></div>
<div class="g" style="flex:.7;flex-direction:row;align-items:center;cursor:pointer" data-a="mode"><div class="f1"><div class="h">Drive mode</div><div class="s">tap to change</div></div><div style="font-size:26px;font-weight:700;color:var(--accent)">${MODES[S.mode]}</div></div>
<div class="row f1"><div class="g f1"><div class="h">Power</div><div class="n" style="font-size:24px">${S.power?'HEV':'EV'}</div></div><div class="g f1"><div class="h">Terrain</div><div class="n" style="font-size:24px">${S.terrain}</div></div><div class="g f1"><div class="h">Tow mode</div><div class="n" style="font-size:24px">${S.tow?'On':'Off'}</div></div></div></div></div>
<div class="row" style="height:84px;gap:8px">${tempBox('pt','Passenger')}${seat('ph','Heat','heat')}${seat('pv','Vent','vent')}<div class="g f1" style="flex-direction:row;align-items:center;gap:6px;padding:6px">${T(S.on?'On':'Off','tog:on',S.on,0,0,64)}${T('−','dec:fan',0,56,0,64)}<div style="width:60px;text-align:center"><div class="s">Fan</div><div style="font-size:26px;font-weight:700">${S.fan}</div></div>${T('+','inc:fan',0,56,0,64)}${T('A/C','tog:ac',S.ac,0,0,64)}${T('Dual','tog:sync',!S.sync,0,0,64)}${T('Recirc','tog:recirc',S.recirc,0,0,64)}</div>${seat('dv','Vent','vent')}${seat('dh','Heat','heat')}${tempBox('dt','Driver')}</div>

const seatLv=(k,label,cls)=>`<div class="col f1" style="gap:4px"><div class="s" style="text-align:center">${label}</div>${T('II','set:'+k+':2',S[k]==2,0,0,52)}${T('I','set:'+k+':1',S[k]==1,0,0,52)}${T('Off','set:'+k+':0',S[k]==0,0,0,48)}</div>`;
const seatCol=s=>`<div class="s" style="font-size:13px;margin-top:6px">Heat</div><div class="col" style="gap:6px">${[['High',2],['Low',1],['Off',0]].map(l=>T(l[0],`set:${s}h:${l[1]}`,S[s+'h']==l[1],0,0,56)).join('')}</div><div class="s" style="font-size:13px;margin-top:10px">Vent</div><div class="col" style="gap:6px">${[['High',2],['Low',1],['Off',0]].map(l=>T(l[0],`set:${s}v:${l[1]}`,S[s+'v']==l[1],0,0,56)).join('')}</div>`;
const step=(k,label,u)=>`<div style="text-align:center"><div class="s" style="font-size:13px">${label}</div><div class="row c" style="gap:0"><button class="t" data-a="dec:${k}" style="width:64px;height:64px;border-radius:32px;font-size:30px;color:var(--text)">−</button><b style="width:150px;font-size:44px;color:${u?tc(S[k]):'var(--text)'}">${S[k]}${u}</b><button class="t" data-a="inc:${k}" style="width:64px;height:64px;border-radius:32px;font-size:30px;color:var(--text)">+</button></div></div>`;
function recordings(){const list=CLIPS.filter(c=>S.filter=='All'||(S.filter=='Protected'?c.p:c.cam==S.filter));const sel=CLIPS[S.clip];return `<div class="row f1" style="min-height:0"><div class="p f1 col" style="gap:6px;overflow:auto"><div class="h">Recordings</div><div class="row" style="flex-wrap:wrap;gap:6px">${T('Back','tog:browse',0,90,0,48)}${['All','Protected','Front','Rear'].map(f=>T(f,'filter:'+f,S.filter==f,110,0,48)).join('')}</div><div class="s">${list.length} clips</div><div>${list.map(c=>`<div class="clip ${CLIPS.indexOf(c)==S.clip?'on':''}" data-a="clip:${CLIPS.indexOf(c)}"><div class="f1"><b>${c.cam}</b><div class="s" style="font-size:13px">${fmtT(c.t)}</div></div>${c.p?'<span style="color:var(--accent);font-size:12px;margin-right:10px">Protected</span>':''}<span class="s" style="font-size:13px">${c.mb} MB</span></div>`).join('')}</div></div>
<div class="col" style="flex:1.6"><div class="p"><div class="h">${sel.cam}  ${fmtT(sel.t)}</div><div class="cam" style="aspect-ratio:1280/700;margin-top:8px;background-image:url(${camUrl(sel.cam)})"><em>${sel.t.toLocaleDateString('en-NZ')} ${sel.t.toLocaleTimeString('en-NZ',{hour12:false})}  62 km/h  ${sel.cam}</em></div><div class="row" style="gap:8px;margin-top:10px">${T('Newer','clipstep:-1',0,110)}${T('Older','clipstep:1',0,110)}${T(sel.p?'Unprotect':'Protect','protect',sel.p,130)}${T('Delete','toast:Clip deleted',0,110)}</div></div>
<div class="p"><div class="h">Storage</div><div class="row c" style="gap:8px;margin-top:6px">${T('Less','cap:-2',0,90)}<b style="width:100px;font-size:24px">${S.cap} GB</b>${T('More','cap:2',0,90)}${T('Time stamp on clips','tog:stamp',S.stamp,220,'date, speed, position')}</div><div class="s" style="font-size:13px;margin-top:8px">Rolling clips 2.3 GB of ${S.cap} GB. Protected 0.4 GB. Oldest rolling clips are removed first.</div></div><div class="p"><div class="h">Send to your phone</div><div class="row c" style="gap:12px;margin-top:6px">${T(S.share?'Sharing on':'Share clips','tog:share',S.share,150,'same wifi as the ute')}${S.share?`<div style="width:96px;height:96px;background:#fff;display:grid;grid-template-columns:repeat(8,1fr);padding:6px;box-sizing:border-box">${Array.from({length:64},(_,i)=>`<i style="background:${(i*7919)%3?'#000':'#fff'}"></i>`).join('')}</div><div><b style="color:var(--accent);font-size:16px">http://192.168.43.1:8188/</b><div class="s">Put your phone on the ute hotspot, scan this, then tap a clip to watch or save it.</div></div>`:''}</div></div></div></div>`}
function toast(m){const n=$('#note');n.textContent=m;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),2200)}
const LIM={pt:[17,33],dt:[17,33],fan:[0,7],petT:[17,26]};
function act(a){const [k,v,w]=a.split(':');
 if(k=='tab'){S.tab=v;S.browse=false}
 else if(k=='tog'){S[v]=!S[v];if(v=='rec'&&S.rec)S.sentry=false;if(v=='sentry'&&S.sentry)S.rec=false}
 else if(k=='inc'||k=='dec'){S[v]=Math.max(LIM[v][0],Math.min(LIM[v][1],S[v]+(k=='inc'?1:-1)));if(S.sync&&v=='dt')S.pt=S.dt}
 else if(k=='seat')S[v]=(S[v]+1)%3;
 else if(k=='set')S[v]=+w;
 else if(k=='mode')S.mode=S.mode%3+1;
 else if(k=='setmode')S.mode=+v;
 else if(k=='colour')S.colour=v;
 else if(k=='theme')S.theme=v;
 else if(k=='trailer'){if(!S.tow)toast('Turn tow mode on first');else S.trailer=+v}
 else if(k=='ext'){S.ext=Math.max(0,Math.min(120,S.ext+ +v));S.left=S.ext?left():null}
 else if(k=='cal')S.cal=Math.max(-20,Math.min(20,S.cal+ +v));
 else if(k=='basis')S.basis=Math.max(3,Math.min(25,S.basis+ +v));
 else if(k=='add')S.add=Math.max(0,Math.min(total(),S.add+ +v));
 else if(k=='addtank'){if(S.add){const n=Math.min(total(),left()+S.add);if(S.ext)S.left=n;else S.fuel=Math.min(100,n/60*100);toast(S.add+' L added');S.add=0}}
 else if(k=='fill'){S.fuel=100;if(S.ext)S.left=total();toast('Full tank logged')}
 else if(k=='resetfuel'){S.cal=0;S.ext=0;S.left=null;toast('Fuel data reset')}
 else if(k=='level'){S.pitch=0;S.roll=0;S.pp=0;S.pr=0}
 else if(k=='sens')S.sens={Smooth:'Normal',Normal:'Quick',Quick:'Smooth'}[S.sens];
 else if(k=='cam')S.cam=v;
 else if(k=='stoprec'){S.rec=false;S.sentry=false}
 else if(k=='clip')S.clip=+v;
 else if(k=='clipstep')S.clip=Math.max(0,Math.min(CLIPS.length-1,S.clip+ +v));
 else if(k=='protect')CLIPS[S.clip].p=!CLIPS[S.clip].p;
 else if(k=='filter')S.filter=v;
 else if(k=='cap')S.cap=Math.max(2,Math.min(110,S.cap+(S.cap>=20?+v*5:+v)));
 else if(k=='biz')S['biz'+v]=!(S['biz'+v]??[1,0,1,1][v]);
 else if(k=='prof'){const p={Boost:[18,18,7],Winter:[24,24,3],Summer:[19,19,4],Camp:[21,21,1],Tane:[21,22,2]}[v];S.dt=p[0];S.pt=p[1];S.fan=p[2];S.on=true;if(v=='Winter'){S.dh=2;S.ph=2}toast(v+' applied')}
 else if(k=='app'){if(S.apps[v]){toast('Opens '+S.apps[v]+' on the ute')}else{S.apps[v]=['Spotify','Waze','YouTube','Maps','Podcasts'][v-1]||'App';toast('On the ute this lists your installed apps')}}
 else if(k=='peton'){S.petMsg=$('#petMsg').value;S.petPh=$('#petPh').value;S.pet=true;S.on=true;S.dt=S.pt=S.petT}
 else if(k=='petoff')S.pet=false;
 else if(k=='memflip'){const m=MEM.find(x=>x[0]==v);const c=S['mv_'+v]??m[3];S['mv_'+v]=c==1?2:1}
 else if(k=='memkeep'){const m=MEM.find(x=>x[0]==v);S['mk_'+v]=S['mv_'+v]??m[3]}
 else if(k=='memreset'){MEM.forEach(m=>S['mv_'+m[0]]=m[3]);if(S.memOn){MEM.forEach(m=>{if(S['mk_'+m[0]]!=null)S['mv_'+m[0]]=S['mk_'+m[0]]});toast('Restarted. Your saved settings were restored')}else toast('Restarted. Turn on Restore at start to put them back')}
 else if(k=='memrestore'){MEM.forEach(m=>{if(S['mk_'+m[0]]!=null)S['mv_'+m[0]]=S['mk_'+m[0]]});toast('Saved settings restored')}
 else if(k=='v2l'){S.v2l=+v;toast('V2L run time set to '+v+' h')}
 else if(k=='sec')S.sec=v;
 else if(k=='toast')toast(a.slice(6));
 draw()}
function draw(){const th=THEMES[S.theme],r=document.documentElement.style;r.setProperty('--accent',th[0]);r.setProperty('--dim',th[1]);r.setProperty('--bad',S.theme=='RED'?'#FFD21F':'#FF5252');
 const b=BG[S.tab],pg=$('#page');pg.style.backgroundImage=S.plain?'none':`url(art/${b[0]}${b[1]?'_'+S.colour:''}.webp)`;pg.style.backgroundColor=S.plain?'#05080F':'';$('#fit').style.fontSize=S.large?'120%':'';$('#in').style.zoom=S.large?'1.12':'';pg.style.setProperty('--w1',b[2]);pg.style.setProperty('--w2',b[3]);pg.style.setProperty('--w3',b[4]);pg.style.backgroundPosition=b[5]||'center';
 const sc=$('#in').scrollTop;$('#in').innerHTML=P[S.tab]();$('#in').scrollTop=sc;
 $('#tabs').innerHTML=TABS.map(t=>`<button class="${t==S.tab?'on':''}" data-a="tab:${t}"><svg viewBox="0 0 24 24">${ICON[t]}</svg>${t}</button>`).join('');
 $('#out').textContent=S.outside+'°C';$('#rec').textContent=S.sentry?'● Sentry armed':S.rec?'● Recording':'';
 let p=$('#pet');if(S.pet){if(!p){p=document.createElement('div');p.id='pet';$('#fit').appendChild(p)}p.innerHTML=`<b style="font-size:64px;letter-spacing:3px;color:var(--accent)">MY PET IS SAFE</b><div style="font-size:32px">The air conditioning is on and set to ${S.petT}°C</div><div style="font-size:26px">${S.petMsg}</div>${S.petPh?`<div style="font-size:30px;color:var(--warm);font-weight:600">If you are worried please call ${S.petPh}</div>`:''}<div class="s" style="font-size:18px">Climate running   Outside ${S.outside}°C   Battery ${Math.round(S.soc)}%</div>${T('Turn pet mode off','petoff',0,280,0,60)}`}else if(p)p.remove();
 $('#fit').style.filter=S.night?'brightness(.45)':'';tick()}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('en-NZ',{hour:'numeric',minute:'2-digit'});const s=$('#stamp');if(s)s.textContent=`${d.toLocaleDateString('en-NZ')} ${d.toLocaleTimeString('en-NZ',{hour12:false})}  ${S.speed} km/h  -36.12467, 174.57031`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a)});
let drag=null;document.addEventListener('pointerdown',e=>{const f=e.target.closest('[data-drag]');if(f)drag={k:f.dataset.drag,x:e.clientX,v:S[f.dataset.drag]}});
document.addEventListener('pointermove',e=>{if(!drag)return;S[drag.k]=Math.max(-45,Math.min(45,drag.v+(e.clientX-drag.x)/4));S.pp=Math.max(S.pp,Math.abs(S.pitch));S.pr=Math.max(S.pr,Math.abs(S.roll));draw()});
document.addEventListener('pointerup',()=>drag=null);
let ph=0;setInterval(()=>{if(S.drive){ph+=.12;S.gear=4;S.speed=Math.round(55+40*Math.sin(ph)+8*Math.sin(ph*3.1));S.rpm=S.speed>70?Math.round(1400+S.speed*14):0;S.power=S.rpm?1:0;S.soc=Math.max(15,S.soc-.03);if(S.rpm)S.fuel=Math.max(5,S.fuel-.02);S.odo+=S.speed/3600*.5;S.coolant=Math.min(92,S.coolant+.05);S.bearing=(S.bearing+2)%360;if(['Gauges','Home'].includes(S.tab)&&!document.activeElement.matches('input'))draw()}else if(S.speed){S.speed=0;S.rpm=0;S.gear=1;S.power=0;draw()}tick()},500);
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$('#fit').style.transform=`translate(-50%,-50%) scale(${s})`}const __q=new URLSearchParams(location.search);if(__q.get('tab'))S.tab=__q.get('tab');if(__q.get('colour'))S.colour=__q.get('colour');addEventListener('resize',fit);fit();draw();
(function(){const i=$('#intro');i.querySelector('#iph').style.backgroundImage=`url(art/bg_home_${S.colour}.webp)`;const end=()=>{i.classList.add('out');setTimeout(()=>i.remove(),500)};i.addEventListener('click',end);if(__q.get('nointro'))end();else setTimeout(end,2600)})();
</script>
